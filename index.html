<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Crowd Simulator POC</title>
  <link rel="stylesheet" href="styles.css?v=20260821-3" />
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Event Crowd Simulator</h1>
        <p>Floor 1 POC — build 2026-08-21.3</p>
      </div>
      <div class="status"><span id="runStatus">READY</span></div>
    </header>

    <section class="metrics">
      <article><small>Sim time</small><strong id="simTime">00:00</strong></article>
      <article><small>Spawned</small><strong id="spawned">0</strong></article>
      <article><small>Reached stairs</small><strong id="completed">0</strong></article>
    </section>

    <section class="workspace">
      <aside>
        <label>Attendees <input id="attendees" type="number" min="1" max="3000" value="500" /></label>
        <label>Arrival duration (min) <input id="arrivalMinutes" type="number" min="1" max="180" value="20" /></label>
        <label>Simulation speed
          <select id="speed">
            <option value="1">1x</option>
            <option value="5">5x</option>
            <option value="20" selected>20x</option>
            <option value="60">60x</option>
          </select>
        </label>
        <button id="start">Run / Reset</button>
        <button id="pause" class="secondary">Pause</button>
        <div class="legend">
          <p><span class="dot walking"></span> Walking attendee</p>
          <p>Ingress: Gerbang → Parkiran → Hiolo → Masuk Vihara → Area Jalan Umat → Tangga</p>
        </div>
        <p class="note">POC geometry is approximate. Parking length reference: 80 m.</p>
      </aside>

      <div class="canvas-wrap">
        <canvas id="sim" width="1000" height="620"></canvas>
      </div>
    </section>
  </main>
  <script type="module" src="src/app.js?v=20260821-3"></script>
</body>
</html>
